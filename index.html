.crystal-card .exercise-identity{grid-template-columns:54px minmax(0,1fr);gap:10px}
.crystal-card .exercise-art{height:74px}.crystal-card .plan-ex-name{font-size:17px!important;line-height:1.3}
.crystal-card .hud-tile-grid{gap:7px;margin-top:14px}.crystal-card .hud-tile{padding:9px 5px}.crystal-card .hud-tile-label{font-size:11px;letter-spacing:.15px}.crystal-card .hud-tile-value{font-size:14px}
.crystal-card .objective-line{font-size:13px}.crystal-card .mission-start{font-size:13px!important;letter-spacing:.5px}
.exercise-log.crystal-card{padding:calc(var(--frame-unit)*320 + 6px) calc(var(--frame-unit)*240 - 8px) calc(var(--frame-unit)*224 + 8px)}
.exercise-log.crystal-card>div:not(.crystal-frame){position:relative;z-index:3}
.exercise-log.crystal-card>div:not(.crystal-frame)>div:first-child{flex-wrap:wrap}
.exercise-log.crystal-card .set-grid{grid-template-columns:repeat(3,minmax(0,1fr)) 32px;gap:6px}
.exercise-log.crystal-card .set-grid>:nth-child(4){grid-column:1/4;grid-row:2}
.exercise-log.crystal-card .set-grid>:nth-child(5){grid-column:4;grid-row:1}
@media(min-width:600px){.crystal-card{--frame-unit:.24px}.crystal-card .exercise-identity{grid-template-columns:84px minmax(0,1fr)}.crystal-card .exercise-art{height:84px}.crystal-card .plan-ex-name{font-size:20px!important}.crystal-card .hud-tile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* Exercise images stay visible in both plan and set-entry views. */
.crystal-card .exercise-identity{grid-template-columns:minmax(0,1fr)!important;gap:16px}
.crystal-card .exercise-art{width:100%;height:210px!important;min-height:180px;background:#030b16;border:1px solid #63c5ff40;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:3px}
.crystal-card .exercise-art img,.crystal-card .exercise-art svg{display:block;width:100%;height:100%;object-fit:contain;flex:none}
.exercise-log.crystal-card>.exercise-art{width:calc(100% - 28px);margin:0 14px 16px}
@media(min-width:600px){.crystal-card .exercise-art{height:250px!important}}

/* Final readability pass: keep exercise prescriptions and history reps readable after frame rules. */
.crystal-card .plan-ex-name{font-size:20px!important;line-height:1.22!important;font-weight:850!important;color:#f2fbff}
.crystal-card .plan-ex-target{font-size:15px!important;line-height:1.45!important;color:#b9d7e8!important;font-weight:750}
.crystal-card .exercise-info>div[style]{font-size:15px!important;line-height:1.45!important;color:#b9d7e8!important}
.crystal-card .tag{font-size:12px!important;padding:4px 9px!important;font-weight:950!important}
.crystal-card .hud-tile-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;margin:18px 0 14px!important}
.crystal-card .hud-tile{padding:12px 9px!important;border-color:#8bdfff55!important;background:#061827cc!important}
.crystal-card .hud-tile-label{font-size:13px!important;line-height:1.25!important;color:#a8c9dc!important;font-weight:950!important;letter-spacing:.45px!important}
.crystal-card .hud-tile-value{font-size:18px!important;line-height:1.22!important;color:#f5fbff!important;font-weight:950!important}
.crystal-card .hud-tile.danger .hud-tile-value{color:#ff6f8c!important}
.crystal-card .objective-line{font-size:15px!important;line-height:1.45!important;color:#c2d9e8!important;margin:14px 0 16px!important;font-weight:700}
.exercise-log.crystal-card .set-grid{font-size:15px!important;gap:8px!important}
.exercise-log.crystal-card .set-head{font-size:13px!important;color:#9fc7de!important;font-weight:950!important}
.exercise-log.crystal-card .inp{font-size:17px!important;font-weight:800!important;text-align:center}
.exercise-cue-panel{margin:0 0 12px;padding:13px 14px;border:1px solid #8be1ff66;background:linear-gradient(135deg,#09233bcc,#061321f2);box-shadow:inset 0 0 18px #43d9ff14,0 0 14px #43d9ff18;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}

.exercise-cue-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#f5fbff;font-size:15px;font-weight:950;letter-spacing:.45px;text-transform:uppercase}
.exercise-cue-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid #ffb84d99;background:#ffb84d18;color:#ffcf7a;font-size:16px;flex:0 0 auto}
.exercise-cue-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.exercise-cue-tag{font-size:13px;line-height:1.2;font-weight:950;letter-spacing:.45px;color:#061321;background:#8be1ff;padding:6px 8px;border-radius:3px;text-transform:uppercase}

function localDateString(date=new Date()){
  const year=date.getFullYear();
  const month=String(date.getMonth()+1).padStart(2,"0");
  const day=String(date.getDate()).padStart(2,"0");
  return year+"-"+month+"-"+day;
}
function localDateFromString(value){
  const [year,month,day]=String(value).split("-").map(Number);
  return new Date(year,month-1,day,12,0,0,0);
}

// ── TIMER RECUPERO ─────────────────────────────────────────────────────
function parseRecoverySec(str){
  if(!str)return 90;
  const m=str.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*min/);
  if(m)return Math.round(Math.max(parseFloat(m[1]),parseFloat(m[2]))*60);
  const m2=str.match(/(\d+)\s*min/);if(m2)return parseInt(m2[1])*60;
  const m3=str.match(/(\d+)\s*sec/);if(m3)return parseInt(m3[1]);
  return 90;
}
// Calcola il tempo di recupero ottimale tra due esercizi consecutivi
// basato su studi scientifici (Schoenfeld 2016, Henselmans 2014)
function calcTransitionRest(curEx,nextEx){
  if(!nextEx)return 0;
  const heavy=ex=>{const n=(ex.n||"").toLowerCase();return n.includes("squat")||n.includes("stacco")||n.includes("deadlift")||n.includes("panca")||n.includes("press")||n.includes("rematore")||n.includes("bilanciere")||n.includes("trazioni");};
  const overlap=(a,b)=>{const ma=(a.muscles||"").toLowerCase(),mb=(b.muscles||"").toLowerCase();return["quadricipiti","femorali","glutei","dorsali","petto","delt","tricipiti","bicipiti","lombari"].some(k=>ma.includes(k)&&mb.includes(k));};
  const isCoreCalves=ex=>{const m=(ex.muscles||"").toLowerCase();return m.includes("addominali")||m.includes("core")||m.includes("soleo")||m.includes("gastrocnemio")||m.includes("tibia");};
  if(isCoreCalves(nextEx))return 60;           // 1 min → core / polpacci
  if(heavy(curEx)&&heavy(nextEx)&&overlap(curEx,nextEx))return 180; // 3 min → compound pesante stessi muscoli
  if(overlap(curEx,nextEx))return 150;          // 2:30 → stessi muscoli
  if(heavy(curEx)||heavy(nextEx))return 120;    // 2 min → almeno un compound pesante
  return 90;                                    // 1:30 → isolamento muscoli diversi
}
function prepareRecoverySound(){
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!recoveryAudioContext)recoveryAudioContext=new AudioContextClass();
  if(recoveryAudioContext.state==="suspended")recoveryAudioContext.resume().catch(()=>{});

  // Un brevissimo segnale silenzioso, avviato dal tocco dell'utente,
  // mantiene l'audio autorizzato su iPhone fino alla fine del recupero.
  const unlockOscillator=recoveryAudioContext.createOscillator();
  const unlockGain=recoveryAudioContext.createGain();
  unlockGain.gain.value=0.0001;
  unlockOscillator.connect(unlockGain);
  unlockGain.connect(recoveryAudioContext.destination);
  unlockOscillator.start();
  unlockOscillator.stop(recoveryAudioContext.currentTime+0.02);
}
function playRecoverySound(){
  prepareRecoverySound();
  if(!recoveryAudioContext)return;
  const play=()=>{
    const now=recoveryAudioContext.currentTime;
    const compressor=recoveryAudioContext.createDynamicsCompressor();
    const masterGain=recoveryAudioContext.createGain();
    compressor.threshold.value=-18;
    compressor.knee.value=8;
    compressor.ratio.value=4;
    compressor.attack.value=0.003;
    compressor.release.value=0.2;
    masterGain.gain.value=0.9;
    compressor.connect(masterGain);
    masterGain.connect(recoveryAudioContext.destination);

    [0,0.42].forEach(delay=>{
      [
        {type:"triangle",frequency:1050,volume:0.72},
        {type:"sine",frequency:2100,volume:0.24}
      ].forEach(tone=>{
        const oscillator=recoveryAudioContext.createOscillator();
        const gain=recoveryAudioContext.createGain();
        oscillator.type=tone.type;
        oscillator.frequency.value=tone.frequency;
        gain.gain.setValueAtTime(0.0001,now+delay);
        gain.gain.exponentialRampToValueAtTime(tone.volume,now+delay+0.018);
        gain.gain.setValueAtTime(tone.volume,now+delay+0.2);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.3);
        oscillator.connect(gain);
        gain.connect(compressor);
        oscillator.start(now+delay);
        oscillator.stop(now+delay+0.31);
      });
    });
  };
  if(recoveryAudioContext.state==="suspended")recoveryAudioContext.resume().then(play).catch(()=>{});
  else play();
}
function startRecoveryTimer(seconds,exName){
  stopRecoveryTimer();
  prepareRecoverySound();
  recTimerEnd=Date.now()+seconds*1000;
  if(window.webkit?.messageHandlers?.recoveryTimer){
    window.webkit.messageHandlers.recoveryTimer.postMessage({action:"start",seconds,title:exName||"Recupero completato"});
  }
  const isTransition=(exName||"").startsWith("→");
  const rtName=document.getElementById("rt-name");
  rtName.textContent=exName||"Recupero";
  rtName.style.color=isTransition?"var(--a2)":"var(--acc)";
  document.getElementById("rec-timer").classList.add("show");
  function tick(){
    const rem=Math.max(0,Math.ceil((recTimerEnd-Date.now())/1000));
    const m=Math.floor(rem/60),s=rem%60;
    const el_=document.getElementById("rt-time");
    if(el_)el_.textContent=m+":"+(s<10?"0":"")+s;
    if(rem<=0){
      stopRecoveryTimer();
      playRecoverySound();
      flash("⏱ Recupero terminato!","#43d9ff");
      if(navigator.vibrate)navigator.vibrate([250,120,250]);
    }
  }
  tick();
  recTimerInterval=setInterval(tick,500);
}
function stopRecoveryTimer(){
  if(recTimerInterval){clearInterval(recTimerInterval);recTimerInterval=null;}
  if(window.webkit?.messageHandlers?.recoveryTimer){
    window.webkit.messageHandlers.recoveryTimer.postMessage({action:"stop"});
  }
  const t=document.getElementById("rec-timer");if(t)t.classList.remove("show");
}

// ── PROGRESSIVE OVERLOAD ───────────────────────────────────────────────
function getOverloadSuggestion(ex,lastSess){
  if(!lastSess||lastSess.sets.length<(ex.sets||1))return null;
  const targetReps=parseInt(ex.reps)||0;
  if(!targetReps)return null;
  const allDone=lastSess.sets.every(s=>parseInt(s.reps||0)>=targetReps);
  if(!allDone)return null;
  const maxKg=Math.max(...lastSess.sets.map(s=>parseFloat(s.kg)||0));
  if(!maxKg)return null;
  return fmt(maxKg+2.5);
}

function checkPRs(wIdx,dk){
  const entry=DB.entries[dk];if(!entry||entry.skipped)return;

  const newPRs=[];

    const maxKg=Math.max(...sets.map(s=>parseFloat(s.kg)||0));if(!maxKg)return;

function calcSessionVolume(sets){
  return Math.round(sets.reduce((a,s)=>a+(parseFloat(s.kg)||0)*(parseFloat(s.reps)||0),0));
}
function calcSetPerformance(s){
  const kg=parseFloat(s.kg)||0;
  const reps=parseFloat(s.reps)||0;
  if(!kg||!reps)return 0;
  const rir=s.rir!==undefined&&s.rir!==""?parseFloat(s.rir):0;
  return kg*(1+((reps+Math.max(0,rir))/30));
}

// ── STREAK ────────────────────────────────────────────────────────────
function getStreak(){
  const weeks={};
  Object.entries(DB.entries).forEach(([d,e])=>{if(!e.skipped)weeks[weekKey(d)]=(weeks[weekKey(d)]||0)+1;});
  if(!Object.keys(weeks).length)return 0;
  let streak=0;
  let cur=new Date();cur.setDate(cur.getDate()-(cur.getDay()===0?6:cur.getDay()-1));
  // La settimana corrente può essere ancora in corso: la saltiamo senza spezzare la streak
  // poi contiamo le settimane precedenti consecutive con ≥2 sessioni
  let started=false;
  for(let i=0;i<53;i++){
  const wk=localDateString(cur);
    const cnt=weeks[wk]||0;
    if(i===0&&cnt<2){cur.setDate(cur.getDate()-7);continue;}// settimana corrente ancora in corso
    if(cnt>=2){streak++;started=true;}
    else if(started)break;
    cur.setDate(cur.getDate()-7);
  }
  return streak;
}

function findNextRestDay(fromDateStr){

  for(let i=1;i<=14;i++){

// Ricalcola tutti i giorni rimanenti della settimana a partire da fromDateStr+1,
// mantenendo la sequenza FULL BODY→PUSH→PULL→CARDIO partendo da fromWIdx.
// I giorni di riposo (in base al calendario originale) rimangono riposo.
// I giorni già completati non vengono toccati ma aggiornano la posizione in sequenza.
function recalculateWeekFrom(fromDateStr,fromWIdx){
  const seq=[0,2,4,5];
  let pos=seq.indexOf(fromWIdx);
  if(pos===-1)pos=0;
  const cur=new Date(fromDateStr+"T00:00:00");
  // Fine settimana = domenica corrente
  const dOw0=cur.getDay()===0?6:cur.getDay()-1;
  const endOfWeek=new Date(cur);endOfWeek.setDate(cur.getDate()+(6-dOw0));
  cur.setDate(cur.getDate()+1);
  while(cur<=endOfWeek){
    const dateStr=localDateString(cur);
    const dOw=cur.getDay()===0?6:cur.getDay()-1;
    const normalWIdx=getWorkoutIdx(dOw);
    const isWorkoutDay=DEF_DAYS[normalWIdx].exs.length>0;
    // Giorni già completati: aggiorna posizione sequenza senza toccare override
    if(DB.entries[dateStr]&&!DB.entries[dateStr].skipped){
      if(isWorkoutDay){const p=seq.indexOf(DB.entries[dateStr].dayIdx);if(p!==-1)pos=p;}
      cur.setDate(cur.getDate()+1);continue;
    }
    if(isWorkoutDay){
      pos=(pos+1)%seq.length;
      DB.dayOverrides[dateStr]=seq[pos];
    } else {
      delete DB.dayOverrides[dateStr]; // riposo: rimuovi override stale
    }
    cur.setDate(cur.getDate()+1);
  }
  saveDB("dayOverrides");
}

const REST_WORKOUT_IDX=1;
const WORKOUT_MUSCLE_GROUPS={
  0:["gambe","petto","dorso","spalle","bicipiti","tricipiti","core"],
  2:["quadricipiti","glutei","petto","spalle","tricipiti","core"],
  4:["femorali","glutei","dorso","bicipiti","core"],
  5:["recupero attivo"],
};
function isRestWorkout(workoutIdx){
  return workoutIdx==null||!DEF_DAYS[workoutIdx]||DEF_DAYS[workoutIdx].exs.length===0;
}
function workoutsConflict(a,b){
  if(isRestWorkout(a)||isRestWorkout(b))return false;
  if(a===b)return true;
  const aGroups=WORKOUT_MUSCLE_GROUPS[a]||[];
  const bGroups=WORKOUT_MUSCLE_GROUPS[b]||[];
  return aGroups.some(group=>bGroups.includes(group));
}
// Rimodula il calendario futuro rispettando il recupero muscolare.
// Gli allenamenti in coda vengono riordinati e i riposi assorbono gli slittamenti.
function remodelScheduleFromDate(dateStr,newWIdx){
  const selectedDate=new Date(dateStr+"T12:00:00");
  const selectedDayIdx=selectedDate.getDay()===0?6:selectedDate.getDay()-1;
  // Parte sempre dalla scheda base: i vecchi override non devono rientrare
  // nella nuova coda, altrimenti possono duplicare allenamenti già spostati.
  const displacedWIdx=getWorkoutIdx(selectedDayIdx);
  const pending=isRestWorkout(displacedWIdx)||displacedWIdx===newWIdx?[]:[displacedWIdx];
  let lastWorkout=isRestWorkout(newWIdx)?null:newWIdx;
  let selectedOccurrenceConsumed=isRestWorkout(newWIdx)||newWIdx===displacedWIdx;

  // Elimina la vecchia pianificazione futura prima di ricostruirla.
  // Le sessioni già completate restano intatte e verranno rispettate nel ciclo.
  const cleanupCursor=new Date(selectedDate);
  for(let i=0;i<21;i++){
    cleanupCursor.setDate(cleanupCursor.getDate()+1);
    const cleanupDate=localDateString(cleanupCursor);
    const completedEntry=DB.entries[cleanupDate];
    if(!completedEntry||completedEntry.skipped)delete DB.dayOverrides[cleanupDate];
  }

  DB.dayOverrides[dateStr]=newWIdx;
  const cursor=new Date(selectedDate);
  for(let i=0;i<21;i++){
    cursor.setDate(cursor.getDate()+1);
    const nextDateStr=localDateString(cursor);
    const nextDayIdx=cursor.getDay()===0?6:cursor.getDay()-1;

    const completedEntry=DB.entries[nextDateStr];
    if(completedEntry&&!completedEntry.skipped){
      lastWorkout=completedEntry.dayIdx;
      continue;
    }

    const nextWIdx=getWorkoutIdx(nextDayIdx);
    if(!isRestWorkout(nextWIdx)){
      if(!selectedOccurrenceConsumed&&nextWIdx===newWIdx){
        selectedOccurrenceConsumed=true;
      } else {
        pending.push(nextWIdx);
      }
    }

    const candidateIndex=pending.findIndex(workoutIdx=>!workoutsConflict(lastWorkout,workoutIdx));
    if(candidateIndex===-1){
      DB.dayOverrides[nextDateStr]=REST_WORKOUT_IDX;
      lastWorkout=null;
    } else {
      const scheduledWIdx=pending.splice(candidateIndex,1)[0];
      DB.dayOverrides[nextDateStr]=scheduledWIdx;
      lastWorkout=scheduledWIdx;
    }

    if(!pending.length&&selectedOccurrenceConsumed)break;
  }

function normalizeCurrentSchedule(){
  const currentDate=todayStr();
  const currentDay=new Date(currentDate+"T12:00:00");
  const currentDayIdx=currentDay.getDay()===0?6:currentDay.getDay()-1;
  const currentEntry=DB.entries[currentDate];
  const hasChangedSchedule=DB.dayOverrides[currentDate]!==undefined;
  if(!hasChangedSchedule&&!currentEntry?.skipped)return;

  const currentWIdx=currentEntry?.skipped
    ?REST_WORKOUT_IDX
    :getDayWorkoutIdx(currentDayIdx,currentDate);
  remodelScheduleFromDate(currentDate,currentWIdx);
}

function getBaseWorkoutIdxForDate(dateStr){
  const d=new Date(dateStr+"T12:00:00");
  const dayIdx=d.getDay()===0?6:d.getDay()-1;

}

function previewShiftWorkoutToNextDay(dateStr,wIdx,days=5){
  const lines=[];
  const start=new Date(dateStr+"T12:00:00");
  lines.push({
    date:dateStr,
    label:start.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"}),
    wIdx:REST_WORKOUT_IDX,
    note:"oggi riposo"
  });
  let carry=wIdx;
  const cursor=new Date(start);
  for(let i=1;i<=days;i++){
    cursor.setDate(cursor.getDate()+1);
    const dStr=localDateString(cursor);
    lines.push({
      date:dStr,
      label:cursor.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"}),
      wIdx:carry,
      note:i===1?"allenamento spostato":""
    });
    carry=getBaseWorkoutIdxForDate(dStr);
  }
  return lines;
}

function shiftWorkoutToNextDay(dateStr,wIdx,reason){
  DB.entries[dateStr]={dayIdx:wIdx,skipped:true,skipReason:reason,ts:new Date().toISOString()};
  DB.dayOverrides[dateStr]=REST_WORKOUT_IDX;
  let carry=wIdx;
  const cursor=new Date(dateStr+"T12:00:00");
  for(let i=1;i<=21;i++){
    cursor.setDate(cursor.getDate()+1);
    const dStr=localDateString(cursor);
    const completed=DB.entries[dStr];
    if(completed&&!completed.skipped)break;
    const base=getBaseWorkoutIdxForDate(dStr);
    DB.dayOverrides[dStr]=carry;
    carry=base;
  }
  saveDB("entries");
  saveDB("dayOverrides");
}

function normalizeExerciseName(name){
  return String(name||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g," ")
    .trim();
}
function getLastSessionSets(wIdx,ei,exName,excludeDate){
  // Cerca l'esercizio reale in tutto lo storico: un cambio di giorno o posizione
  // nella scheda non deve far riemergere una prestazione vecchia di mesi.
  const targetName=normalizeExerciseName(exName);
  const prev=Object.entries(DB.entries)
    .filter(([d,e])=>!e.skipped&&Array.isArray(e.sets)&&d<(excludeDate||todayStr()))
    .sort((a,b)=>b[0].localeCompare(a[0]));
  for(const [date,entry] of prev){
    const sets=(entry.sets||[]).filter(s=>{
      const setName=s.exName||entry.exercises?.[s.ei]?.n;
      if(setName)return normalizeExerciseName(setName)===targetName;

      // Compatibilità con le sessioni più vecchie, che non salvavano il nome:
      // in quel caso l'indice è attendibile soltanto nello stesso workout.
      return entry.dayIdx===wIdx&&s.ei===ei;
    });
    if(sets.length)return{date,sets};
  }
  return null;
}

function parseCoachNumber(value,min,max){
  if(value===null||value===undefined||String(value).trim()==="")return null;
  const text=String(value).trim().replace(",",".");
  const range=text.match(/^(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)$/);
  const number=range?(Number(range[1])+Number(range[2]))/2:Number(text);
  return Number.isFinite(number)&&number>=min&&number<=max?number:null;
}

    .map(([date,entry])=>({date,sets:entry.sets.filter(set=>{

  if(/petto|panca|croci|chest|push-up/.test(txt))return "chest";

  if(/spalle|deltoid|lento|alzate|shoulder/.test(txt))return "shoulders";

      if(!isJumpSetEligible(exDefs[j])||!areJumpSetGroupsCompatible(group,otherGroup))continue;
      const distance=j-i;
      const score=(distance<=4?5:distance<=7?2:0)+(group==="legs"||otherGroup==="legs"?3:0);
      if(score>bestScore){best=j;bestScore=score;}
    }
    if(best!==-1&&bestScore>0){pairs.push([i,best]);used.add(i);used.add(best);}
  });
  return pairs;
}
function getSuggestedJumpSetPairForIndex(ei,exDefs){
  return getSuggestedJumpSetPairs(exDefs).find(pair=>pair.includes(ei))||null;
}
function getJumpSetNext(ei,exDefs){
  const pair=jumpSetPairs.find(p=>p.includes(ei));
  if(!pair)return null;
  const partnerIdx=pair[0]===ei?pair[1]:pair[0];
  const partner=exDefs[partnerIdx];
  if(!partner)return null;
  const partnerSets=logSets.filter(s=>s.ei===partnerIdx).length;
  if(partnerSets<(partner.sets||1))return{idx:partnerIdx,ex:partner};
  return null;
}

          startRecoveryTimer(30,"JS "+getJumpSetLabelForIndex(ei)+" → "+jumpNext.ex.n);
        } else if(newCount>=ex.sets){
          if(nextEx)startRecoveryTimer(calcTransitionRest(ex,nextEx),"→ "+nextEx.n);
          else stopRecoveryTimer(); // ultimo esercizio, niente timer
        } else {
          // Serie intermedia → recupero tra serie dello stesso esercizio
          startRecoveryTimer(parseRecoverySec(ex.recovery),ex.n);
        }
        render();
      }});
    addSerieBtn.textContent=isCardio
      ?(remaining>0?"+ Durata ("+mySets.length+"/"+ex.sets+" · mancano "+remaining+")":"+ Durata extra")
      :(remaining>0?"+ Serie ("+mySets.length+"/"+ex.sets+" · mancano "+remaining+")":"+ Serie extra");
    body.appendChild(addSerieBtn);
    // Pulsante "Pre-carica tutti i pesi" se ci sono dati precedenti e non ho ancora inserito serie
    if(lastSess&&mySets.length===0){
      const preloadBtn=el("button",{class:"btn",style:"margin-top:6px;font-size:11px;padding:6px 14px;width:100%;border-color:var(--acc);color:var(--acc)",
        onclick:()=>{
          // Aggiunge tutte le serie pre-compilate dall'ultima sessione.
          lastSess.sets.forEach((s,i)=>{
            logSets.push({ei,kg:isCardio?"":s.kg||"",reps:s.reps||"",rir:isCardio?"":s.rir||"",note:s.note||""});
          });
          render();
          flash(isCardio?"⚡ Cardio caricato dall'ultima sessione!":"⚡ Pesi caricati dall'ultima sessione!","var(--acc)");
        }});
      preloadBtn.textContent=(isCardio?"⚡ Carica cardio ultima sessione (":"⚡ Carica pesi ultima sessione (")+lastSess.date.slice(5)+")";
      body.appendChild(preloadBtn);
    }
    const exerciseComplete=mySets.length>=(parseInt(ex.sets)||1);
    const coachPanel=exerciseComplete&&!isCardio?el("div",{class:"ai-coach-panel"}):null;
    if(coachPanel){
      const coachSessions=getCoachSessions(ex.n,dk);
      const cachedCoach=getCoachCache()[coachSignature(ex.n,coachSessions)];
      if(cachedCoach)renderCoachResult(coachPanel,cachedCoach);
      else coachPanel.innerHTML='<div class="ai-coach-head"><div class="ai-coach-title">SYSTEM AI COACH</div><div class="ai-coach-source">Pronto</div></div><div class="ai-coach-loading">Salva l’esercizio completato per analizzare le ultime sessioni.</div>';
    }
    const saveExerciseBtn=el("button",{
      class:"btn"+(exerciseComplete?" btn-acc":""),
      style:"margin-top:8px;font-size:12px;padding:10px 14px;width:100%;border-color:var(--legs);color:"+(exerciseComplete?"#020711":"var(--legs)")+";opacity:"+(mySets.length?"1":".45"),
      onclick:()=>{
        if(!mySets.length){flash("Inserisci almeno una serie prima di salvare","#ff6b47");return;}
        saveSessionProgress("✓ "+ex.n+" salvato");
        saveExerciseBtn.textContent="✓ Esercizio salvato";
        saveExerciseBtn.style.background="var(--legs)";
        saveExerciseBtn.style.color="#020711";
        if(exerciseComplete&&coachPanel)runAiCoach(coachPanel,ex.n,dk);
      }
    },[exerciseComplete?"💾 Salva esercizio completato":"💾 Salva progressi esercizio ("+mySets.length+"/"+ex.sets+")"]);
    body.appendChild(saveExerciseBtn);
    if(coachPanel)body.appendChild(coachPanel);
    card.appendChild(body);
    c.appendChild(card);
  });

  if(logSets.length){
    const vol=calcSessionVolume(logSets);
    const lastEntry=Object.entries(DB.entries).filter(([d,e])=>e.dayIdx===wIdx&&!e.skipped&&d<dk).sort((a,b)=>b[0].localeCompare(a[0]))[0];
    const prevVol=lastEntry?calcSessionVolume(lastEntry[1].sets||[]):0;
    const diff=vol-prevVol;
    const volBox=el("div",{class:"vol-bar"});
    volBox.appendChild(el("div",{},[
      el("div",{style:"font-size:9px;color:var(--mut);letter-spacing:.5px;font-weight:700"},["📦 VOLUME SESSIONE"]),
      el("div",{style:"font-size:18px;font-weight:900;color:var(--acc)"},[vol.toLocaleString("it")+" kg"])
    ]));
    if(prevVol){
      const sign=diff>=0?"+":"";
      const col=diff>0?"var(--legs)":diff<0?"var(--a3)":"var(--mut)";
      volBox.appendChild(el("div",{style:"text-align:right"},[
        el("div",{style:"font-size:9px;color:var(--mut)"},["vs ultima"]),
        el("div",{style:"font-size:14px;font-weight:800;color:"+col},[sign+diff.toLocaleString("it")+" kg"])
      ]));
    }
    c.appendChild(volBox);
  }
  const ta=el("textarea",{class:"inp",placeholder:"Note sessione (energia, dolori, mood…)",style:"margin-bottom:10px"});
  ta.value=logNote;ta.addEventListener("input",()=>{logNote=ta.value;});
  c.appendChild(ta);

  const br=el("div",{class:"btn-row"});
  br.appendChild(el("button",{class:"btn btn-acc",style:"flex:2",onclick:()=>{
    saveSessionProgress("✓ Sessione salvata!",true);
  }},["💾 Salva sessione"]));
  br.appendChild(el("button",{class:"btn",style:"flex:1",onclick:()=>{logSets=[];logNote="";render();flash("Reset fatto","#9b47ff");}},["🔄 Reset"]));
  if(DB.entries[dk]&&DB.entries[dk].dayIdx===wIdx&&!DB.entries[dk].skipped){
    br.appendChild(el("button",{class:"btn btn-danger",style:"flex:1",onclick:()=>{
      if(!confirm("Eliminare?"))return;
      delete DB.entries[dk];saveDB("entries");logSets=[];logNote="";render();
    }},["🗑️"]));
  }
  c.appendChild(br);
  const exportDraft=()=>({
    dayIdx:wIdx,
    exercises:exDefs.map(ex=>({...ex})),
    sets:logSets.map(set=>({...set,exName:exDefs[set.ei]?.n||set.exName||""})),
    notes:logNote,
    ts:new Date().toISOString()
  });
  c.appendChild(el("button",{class:"btn",style:"width:100%;margin-top:8px;font-size:12px;padding:10px;border-color:var(--a2);color:var(--a2);touch-action:manipulation",
    onclick:()=>{if(!logSets.length&&!logNote.trim()&&!DB.entries[dk]){flash("Salva o inserisci dati prima di esportare","#47c8ff");return;}generateDayReport(dk,exportDraft());}},["📤 Esporta giornata con note"]));
  renderSkipSection(c,dk,wIdx);
}

// ── Sezione SALTA ALLENAMENTO (estratta per riuso) ────────────────────
function renderSkipSection(c,dk,wIdx){
  const skipWrap=el("div",{style:"margin-top:8px"});
  if(DB.entries[dk]&&DB.entries[dk].skipped){
    const skipBox=el("div",{style:"background:#ff6b4722;border:1px solid #ff6b4766;border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center"});
    skipBox.appendChild(el("div",{},[
      el("div",{style:"font-weight:800;font-size:12px;color:var(--a3);letter-spacing:.3px"},["🚫 ALLENAMENTO SALTATO"]),
      el("div",{style:"font-size:11px;color:var(--mut);margin-top:3px"},[DB.entries[dk].skipReason||"Motivo non specificato"])
    ]));
    const skipActions=el("div",{style:"display:flex;gap:6px;flex-shrink:0"});
    skipActions.appendChild(el("button",{class:"btn btn-sm",style:"border-color:var(--legs);color:var(--legs)",onclick:()=>{
      const skipped=DB.entries[dk];
      shiftWorkoutToNextDay(dk,skipped.dayIdx,skipped.skipReason||"Allenamento spostato");
      render();flash("↺ "+DEF_DAYS[skipped.dayIdx].name+" spostato al giorno successivo","#a8ff47");
    }},["↺ Sposta"]));
    skipActions.appendChild(el("button",{class:"btn btn-sm",onclick:()=>{delete DB.entries[dk];saveDB("entries");delete DB.dayOverrides[dk];saveDB("dayOverrides");render();flash("Annullato","#9b47ff");}},["Annulla"]));
    skipBox.appendChild(skipActions);
    skipWrap.appendChild(skipBox);
  } else if(!DB.entries[dk]){
    skipWrap.appendChild(el("button",{class:"btn",style:"width:100%;border-color:var(--a3);color:var(--a3);padding:11px;font-size:13px",onclick:()=>openSkipModal(dk,wIdx)},["🚫 Salta allenamento — segna il motivo"]));
  }
  c.appendChild(skipWrap);
}

// Calcola per ogni workout quanti giorni fa è stato fatto l'ultima volta
function getWorkoutRecency(referenceDate){
  const wIdxList=[0,2,4];
  const reference=referenceDate||todayStr();
  const referenceMs=Date.parse(reference+"T00:00:00Z");
  return wIdxList.map(wIdx=>{
    const sessions=Object.entries(DB.entries)
      .filter(([date,e])=>date<reference&&e.dayIdx===wIdx&&!e.skipped&&Array.isArray(e.sets)&&e.sets.length>0)
      .sort((a,b)=>b[0].localeCompare(a[0]));
    let daysAgo=null;
    let lastDate=null;
    if(sessions.length){
      lastDate=sessions[0][0];
      const lastDateMs=Date.parse(lastDate+"T00:00:00Z");
      daysAgo=Math.round((referenceMs-lastDateMs)/86400000);
    }
    return{wIdx,daysAgo,lastDate};
  }).sort((a,b)=>{
    // Mai fatto → priorità massima; altrimenti più giorni fa → prima
    const da=a.daysAgo==null?9999:a.daysAgo;
    const db=b.daysAgo==null?9999:b.daysAgo;
    return db-da;
  });
}

function getDateWorkoutIndex(dateStr){
  const entry=DB.entries[dateStr];
  if(entry)return entry.skipped?REST_WORKOUT_IDX:entry.dayIdx;
  const d=new Date(dateStr+"T12:00:00");
  const dayIdx=d.getDay()===0?6:d.getDay()-1;
  return getDayWorkoutIdx(dayIdx,dateStr);
}
function getWorkoutTimeForDate(dateStr){
  return DB.nutritionPrefs.workoutTimes[dateStr]||DB.nutritionPrefs.defaultWorkoutTime||"afternoon";
}
function isTimeValue(v){return /^\d{2}:\d{2}$/.test(String(v||""));}
function timeToMin(v){
  const t=isTimeValue(v)?v:"08:00";
  const [h,m]=t.split(":").map(Number);
  return h*60+m;
}
function minToTime(min){
  const m=((Math.round(min/5)*5)%1440+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}
function addTime(v,delta){return minToTime(timeToMin(v)+delta);}
function getWorkoutClockForDate(dateStr){
  return DB.nutritionPrefs.workoutClocks[dateStr]||DB.nutritionPrefs.defaultWorkoutClock||"17:30";
}
function getSnackClockForDate(dateStr){
  return DB.nutritionPrefs.snackClocks[dateStr]||DB.nutritionPrefs.defaultSnackClock||"11:00";
}
function getNutritionTargetsForDate(dateStr){
  const p=DB.profile||{};
  const weight=parseFloat(p.peso)||86.5;
  const height=parseFloat(p.altezza)||176;
  const age=parseFloat(p.eta)||31;
  const sex=p.sesso==="F"?-161:5;
  const bmr=(10*weight)+(6.25*height)-(5*age)+sex;
  const activity={sedentario:1.35,leggero:1.45,attivo:1.6}[p.lavoro]||1.35;
  const maintenance=Math.round(bmr*activity);
  const wIdx=getDateWorkoutIndex(dateStr);
  const day=DEF_DAYS[wIdx]||DEF_DAYS[REST_WORKOUT_IDX];
  const entry=DB.entries[dateStr];
  const skipped=!!entry?.skipped;
  const isRest=skipped||!day.exs.length;
  const isMain=[0,2,4].includes(wIdx);
  const isCardio=wIdx===5;
  const deficit=isRest?430:isMain?240:330;
  const kcal=Math.max(1850,Math.round((maintenance-deficit)/25)*25);
  const protein=Math.round(weight*2.1);
  const fat=Math.round(weight*(isRest?0.78:0.72));
  const carbs=Math.max(90,Math.round((kcal-(protein*4)-(fat*9))/4));
  return{kcal,p:protein,c:carbs,f:fat,maintenance,wIdx,day,isRest,isMain,isCardio,skipped};
}
function buildMealSchedule(dateStr,targets){
  const p=DB.profile||{};

  const lunch=isTimeValue(p.pranzo)?p.pranzo:"14:30";
  const dinner=isTimeValue(p.cena)?p.cena:"20:30";
  const workout=getWorkoutClockForDate(dateStr);
  const snackEnabled=DB.nutritionPrefs.snackEnabled!==false;
  const snackClock=getSnackClockForDate(dateStr);
  const snackMeal={
    t:snackClock,
    n:"Spuntino",
    role:"snack",
    macro:targets.isRest?"20-30g proteine · 15-25g carbo":"20-30g proteine · 25-40g carbo",
    foods:targets.isRest?"Yogurt greco 170-250g + frutti rossi, oppure whey 30g + 1 frutto.":"Whey 30g + banana, oppure yogurt greco 250g + fette biscottate/integrali 30-40g.",
    why:"Lo usi se tra due pasti passano troppe ore o arrivi affamato al pasto successivo."
  };
  const withSnack=items=>snackEnabled?[...items,snackMeal].sort((a,b)=>timeToMin(a.t)-timeToMin(b.t)):items;
  const wMin=timeToMin(workout);

  const isMorning=wMin<11*60;

    {t:addTime(wake,30),n:"Colazione",role:"base",macro:"35-45g proteine · 35-50g carbo lenti · 10-15g grassi",foods:"Yogurt greco 250g + avena 40g, oppure 3 uova + pane integrale 60g.",why:"Apre la giornata senza picchi di fame: proteine sazianti e carboidrati lenti."},

  ]);
  if(isMorning)return withSnack([
    {t:Math.max(wakeMin+10,wMin-45)>wakeMin?minToTime(Math.max(wakeMin+10,wMin-45)):addTime(wake,10),n:"Pre-workout leggero",role:"pre",macro:"20-30g carbo rapidi · 20-25g proteine · grassi quasi zero",foods:"1 banana + whey 25g, oppure yogurt greco 170g + miele.",why:"Ti dà energia senza rallentare la digestione."},

    {t:addTime(workout,75),n:"Colazione post-workout",role:"post",macro:"35-45g proteine · 70-90g carbo lenti",foods:"Yogurt greco 250g + avena 70g + banana, oppure uova 3 + pane integrale 90g.",why:"Qui rimetti glicogeno e proteine dopo il lavoro."},
    {t:lunch,n:"Pranzo",role:"meal",macro:"45-55g proteine · 70-90g carbo lenti · verdure",foods:"Riso/pasta 90g crudi + pollo 180g + verdure.",why:"Mantiene energia e recupero senza sgarrare."},
    {t:dinner,n:"Cena",role:"meal",macro:"45-55g proteine · 40-70g carbo · verdure",foods:"Pesce/carne 200g + patate 300g o pane 80g + verdure.",why:"Completa macro e sazietà serale."}
  ]);
  if(isEvening)return withSnack([
    {t:addTime(wake,30),n:"Colazione",role:"base",macro:"35-45g proteine · 50-70g carbo lenti",foods:"Yogurt greco 250g + avena 60g + frutta, oppure 3 uova + pane integrale 80g.",why:"Proteine = yogurt/uova/whey; carbo lenti = avena, pane integrale, fette integrali."},
    {t:lunch,n:"Pranzo",role:"meal",macro:"45-55g proteine · 80-100g carbo lenti",foods:"Pasta/riso 90g crudi + pollo/tonno 180g + verdure.",why:"È il pasto che sostiene il pomeriggio."},
    {t:addTime(workout,-90),n:"Pre-workout",role:"pre",macro:"25-40g carbo digeribili · 20-30g proteine · pochi grassi",foods:"Banana + whey, oppure pane 70g + bresaola 80g.",why:"Deve caricarti, non appesantirti."},
    {t:workout,n:"Allenamento",role:"workout",macro:"Acqua durante",foods:"Caffeina opzionale 45-60 min prima se la tolleri.",why:"Allenamento serale: evita pasti troppo grassi prima."},
    {t:timeToMin(dinner)>wMin?dinner:addTime(workout,90),n:"Cena post-workout",role:"post",macro:"45-60g proteine · 70-100g carbo · verdure",foods:"Riso/patate/pane + carne/pesce/uova; grassi moderati.",why:"È sia cena sia post-workout."}

    {t:timeToMin(lunch)<wMin-90?lunch:addTime(workout,-150),n:"Pranzo / Pre-workout",role:"pre",macro:"45-55g proteine · 90-110g carbo lenti · pochi grassi",foods:"Riso/pasta 90-110g crudi + pollo 180g + verdure leggere.",why:"2-3 ore prima: carboidrati lenti per spingere in palestra."},

  ]);

function exportBackup(){
  const data={
    entries:DB.entries,
    nutrition:DB.nutrition,
    exDefs:DB.exDefs,
    recoveries:DB.recoveries,
    scheduleOffset:DB.scheduleOffset,
    programStart:DB.programStart,
    currentPhase:DB.currentPhase,
    prs:DB.prs,
    bodyWeights:DB.bodyWeights,
    mealTemplates:DB.mealTemplates,
    nutritionFavorites:DB.nutritionFavorites,
    weightReminder:DB.weightReminder,
    customFoods:LS.get("ft_custom_foods")||[],
    nutritionPrefs:DB.nutritionPrefs,
    dayOverrides:DB.dayOverrides,
    profile:DB.profile,
    exportedAt:new Date().toISOString(),
    version:"2.1"
  };
  const json=JSON.stringify(data,null,2);
  const date=localDateString();
  const filename="tracker-fitness-backup-"+date+".json";
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.exportBackup){
    window.webkit.messageHandlers.exportBackup.postMessage({content:json,filename});
    return;
  }
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);
  flash("💾 Backup esportato!","#47c8ff");
}

function backupExportFinished(succeeded){
  flash(succeeded?"💾 Backup salvato!":"Esportazione annullata o non riuscita",succeeded?"#47c8ff":"#ff6b47");
}

function isPlainObject(value){
  return value!==null&&typeof value==="object"&&!Array.isArray(value);
}
function validateBackup(data){
  if(!isPlainObject(data))return "Il contenuto non è un backup valido";
  if(!isPlainObject(data.entries)||!isPlainObject(data.nutrition))return "Archivio allenamenti o alimentazione non valido";
  if(data.exDefs!==undefined&&!Array.isArray(data.exDefs))return "Definizioni esercizi non valide";
  if(data.dayOverrides!==undefined&&!isPlainObject(data.dayOverrides))return "Calendario non valido";
  if(data.bodyWeights!==undefined&&!Array.isArray(data.bodyWeights))return "Storico peso non valido";
  if(data.nutritionFavorites!==undefined&&!Array.isArray(data.nutritionFavorites))return "Pasti preferiti non validi";
  const invalidEntry=Object.entries(data.entries).some(([date,entry])=>
    !/^\d{4}-\d{2}-\d{2}$/.test(date)||!isPlainObject(entry)||
    (entry.dayIdx!==undefined&&(!Number.isInteger(entry.dayIdx)||entry.dayIdx<0||entry.dayIdx>6))||
    (entry.sets!==undefined&&!Array.isArray(entry.sets))
  );
  if(invalidEntry)return "Una o più sessioni contengono dati non validi";
  return null;
}

function importBackup(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const validationError=validateBackup(data);
      if(validationError){flash(validationError,"#ff6b47");return;}
      if(!confirm("Importare il backup? I dati attuali verranno sostituiti.")){return;}
      if(data.entries){DB.entries=data.entries;saveDB("entries");}
      if(data.nutrition){DB.nutrition=data.nutrition;saveDB("nutrition");}
      if(data.exDefs){DB.exDefs=data.exDefs;saveDB("exDefs");}
      if(data.recoveries){DB.recoveries=data.recoveries;saveDB("recoveries");}
      if(data.scheduleOffset!==undefined){DB.scheduleOffset=data.scheduleOffset;saveDB("scheduleOffset");}
      if(data.programStart){DB.programStart=data.programStart;saveDB("programStart");}
      if(data.currentPhase){DB.currentPhase=data.currentPhase;saveDB("currentPhase");}
      if(data.prs){DB.prs=data.prs;saveDB("prs");}
      if(data.bodyWeights){DB.bodyWeights=data.bodyWeights;saveDB("bodyWeights");}
      if(data.mealTemplates){DB.mealTemplates=data.mealTemplates;saveDB("mealTemplates");}
      if(data.nutritionFavorites){DB.nutritionFavorites=data.nutritionFavorites;saveDB("nutritionFavorites");}
      if(data.weightReminder){DB.weightReminder=data.weightReminder;saveDB("weightReminder");}
      if(data.customFoods){LS.set("ft_custom_foods",data.customFoods);}
      if(data.nutritionPrefs){DB.nutritionPrefs=data.nutritionPrefs;saveDB("nutritionPrefs");}
      if(data.dayOverrides){DB.dayOverrides=data.dayOverrides;saveDB("dayOverrides");}
      if(data.profile){DB.profile=data.profile;saveDB("profile");}
      flash("✓ Backup importato!","#a8ff47");
      render();
    }catch(err){flash("Errore lettura file","#ff6b47");}
  };
  reader.readAsText(file);
}

function addDaysStr(dateStr,days){
  const d=new Date(dateStr+"T12:00:00");
  d.setDate(d.getDate()+days);
  return localDateString(d);
}
function getProgressSeries(wIdx,ei,endDate){
  const exName=(getExDefs(wIdx)[ei]||{}).n;
  return Object.entries(DB.entries).sort((a,b)=>a[0].localeCompare(b[0])).reduce((acc,[date,e])=>{
    if(endDate&&date>endDate)return acc;
    if(e.dayIdx!==wIdx||e.skipped)return acc;
    const ms=(e.sets||[]).filter(s=>{
      const savedName=s.exName||e.exercises?.[s.ei]?.n;
      return s.ei===ei||savedName===exName;
    });
    const loadedSets=ms.filter(s=>(parseFloat(s.kg)||0)>0);
    if(!loadedSets.length)return acc;
    const topSet=[...loadedSets].sort((a,b)=>{
      const kgDiff=(parseFloat(b.kg)||0)-(parseFloat(a.kg)||0);
      if(kgDiff)return kgDiff;
      return (parseFloat(b.reps)||0)-(parseFloat(a.reps)||0);
    })[0];
    const rir=parseFloat(topSet.rir);
    acc.push({
      label:date.slice(5),
      date,
      maxkg:parseFloat(topSet.kg)||0,
      reps:parseFloat(topSet.reps)||0,
      rir:Number.isNaN(rir)?null:fmt(rir)
    });
    return acc;
  },[]);
}
function sparklineSvgString(data,color){

  const vals=data.map(d=>d.v),mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
  const px=i=>pad+(i/(data.length-1))*(W-pad*2),py=v=>H-pad-((v-mn)/range)*(H-pad*2);
  const pts=data.map((d,i)=>`${px(i)},${py(d.v)}`).join(" ");
  const base=`${px(0)},${H} ${pts} ${px(data.length-1)},${H}`;
  const labels=data.map((d,i)=>{
    const x=px(i),y=py(d.v);
    return `<circle cx="${x}" cy="${y}" r="3.6" fill="${color}"/><text x="${x}" y="${Math.max(10,y-7)}" text-anchor="middle" font-size="8" font-weight="700" fill="${color}">${escHtml(d.v)}</text><text x="${x}" y="${H-2}" text-anchor="middle" font-size="7" fill="#777">${escHtml(d.label)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="86" role="img" aria-label="grafico rendimento"><polygon points="${base}" fill="${color}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${labels}</svg>`;
}
